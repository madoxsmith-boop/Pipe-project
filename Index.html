<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pipe AI — UA Local 38</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080b12;color:#e2e8f0;font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}
select,input,textarea{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:#e2e8f0;padding:7px 10px;font-size:11px;font-family:'Space Mono',monospace;width:100%;outline:none}
select:focus,input:focus,textarea:focus{border-color:rgba(200,134,10,0.6)}
select option{background:#131929}
label{display:block;font-size:9px;font-weight:700;letter-spacing:0.14em;color:rgba(148,163,184,0.55);margin-bottom:4px;text-transform:uppercase}
button{cursor:pointer;font-family:'Syne',sans-serif}
#app{height:100vh;display:flex;flex-direction:column}
#hdr{height:54px;background:#050810;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;padding:0 18px;justify-content:space-between;flex-shrink:0}
#logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#c8860a,#7a4e06);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:12px}
.ttl{font-weight:800;font-size:15px;letter-spacing:0.08em;color:#f1c45a}
.sub{font-size:9px;color:rgba(200,134,10,0.55);letter-spacing:0.2em}
#stats{display:flex;gap:6px}
.chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:4px 10px;text-align:center}
.chip .cl{font-size:8px;color:rgba(148,163,184,0.45);letter-spacing:0.1em;display:block}
.chip .cv{font-size:10px;font-weight:700;font-family:'Space Mono',monospace}
.vbadge{background:rgba(200,134,10,0.10);border:1px solid rgba(200,134,10,0.25);border-radius:6px;padding:5px 12px;font-size:10px;color:#f0a832;font-weight:800}
#body{flex:1;display:flex;overflow:hidden}
#sb{width:272px;flex-shrink:0;background:#0c1018;border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;transition:width 0.2s;overflow:hidden}
#sb.closed{width:0}
.sbhdr{padding:14px 18px 10px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:9px;font-weight:700;letter-spacing:0.2em;color:rgba(148,163,184,0.35)}
#sbform{flex:1;overflow-y:auto;padding:14px 18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.f1{margin-bottom:14px}
#sysi{padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
#sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sbfoot{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.06)}
#gbtn{width:100%;padding:12px 0;background:linear-gradient(135deg,#c8860a,#a06c08);border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;letter-spacing:0.12em;display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s}
#gbtn:hover:not(:disabled){background:linear-gradient(135deg,#d4960f,#b07a0a);transform:translateY(-1px)}
#gbtn:disabled{background:rgba(200,134,10,0.2);cursor:not-allowed;transform:none}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tabs{height:46px;background:rgba(5,8,16,0.98);border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;padding:0 12px;gap:4px;flex-shrink:0}
.tb{padding:5px 14px;background:transparent;border:1px solid transparent;border-radius:6px;color:rgba(148,163,184,0.6);font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;transition:all 0.15s}
.tb:hover{background:rgba(255,255,255,0.06)}
.tb.on{background:rgba(200,134,10,0.15);border-color:rgba(200,134,10,0.35);color:#f0a832}
#tact{margin-left:auto;display:flex;gap:6px}
.ibtn{padding:5px 13px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:rgba(148,163,184,0.7);font-size:10px;font-weight:600}
#cnt{flex:1;overflow:auto}
.cwrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:#111}
.cwrap canvas{max-width:100%;height:auto;border-radius:3px;box-shadow:0 8px 40px rgba(0,0,0,0.55)}
#emp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#0a0d14;text-align:center}
.etitle{font-size:13px;font-weight:700;color:rgba(148,163,184,0.18);letter-spacing:0.12em}
.esub{font-size:11px;color:rgba(148,163,184,0.12);margin-top:5px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{padding:4px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:20px;font-size:10px;color:rgba(148,163,184,0.25)}
#dpane{padding:30px 36px;max-width:880px;background:#0a0d14}
.dsec{margin-bottom:28px;padding-bottom:28px;border-bottom:1px solid rgba(255,255,255,0.06)}
.dhdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dico{width:26px;height:26px;border-radius:7px;background:rgba(200,134,10,0.12);border:1px solid rgba(200,134,10,0.25);display:flex;align-items:center;justify-content:center;font-size:12px;color:#c8860a}
.dlbl{font-size:10px;font-weight:700;letter-spacing:0.15em;color:rgba(148,163,184,0.55)}
.dtxt{font-size:11px;line-height:1.9;color:#94a3b8;white-space:pre-wrap;font-family:'Space Mono',monospace}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scard{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:16px 20px}
.sclbl{font-size:9px;font-weight:700;letter-spacing:0.18em;color:rgba(148,163,184,0.4);margin-bottom:6px}
.scval{font-size:32px;font-weight:800;line-height:1;font-family:'Space Mono',monospace}
.scunit{font-size:12px;color:rgba(148,163,184,0.4);margin-left:6px}
#mpane{padding:26px 30px;max-width:980px;background:#0a0d14}
.cpills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.cpill{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.12em}
.mtbl{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
.mtbl table{width:100%;border-collapse:collapse;font-size:12px}
.mtbl th{text-align:left;color:rgba(148,163,184,0.45);font-size:9px;font-weight:700;letter-spacing:0.12em;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.07)}
.mtbl td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,0.04)}
.mtbl tr:nth-child(even){background:rgba(255,255,255,0.02)}
.mnote{margin-top:12px;padding:11px 15px;background:rgba(200,134,10,0.07);border:1px solid rgba(200,134,10,0.20);border-radius:8px;font-size:10px;color:rgba(200,134,10,0.65);font-family:'Space Mono',monospace}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,0.25);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite}
</style>
</head>
<body>
<div id="app">
<div id="hdr">
  <div class="hdr-left">
    <div id="logo"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="#fff" stroke-width="1.5" opacity="0.8"/><line x1="10" y1="2" x2="10" y2="18" stroke="#fff" stroke-width="1.2" opacity="0.6"/><line x1="2" y1="10" x2="18" y2="10" stroke="#fff" stroke-width="1.2" opacity="0.6"/><circle cx="10" cy="10" r="2.5" fill="#fff" opacity="0.9"/></svg></div>
    <div><div class="ttl">PIPE AI</div><div class="sub">UA LOCAL 38 · PIPE FITTING INTELLIGENCE</div></div>
  </div>
  <div id="stats" style="display:none"></div>
  <div class="vbadge">v10.0 <span style="font-size:9px;color:rgba(200,134,10,0.45);font-weight:400">ME STANDARD</span></div>
</div>
<div id="body">
  <div id="sb">
    <div class="sbhdr">PIPE CONFIGURATION</div>
    <div id="sbform">
      <div class="f1"><label>Job Description</label><textarea id="fjd" rows="3" placeholder="e.g. 2&quot; DHW supply riser floors 2-4&#10;Include 'riser/floor' for vertical"></textarea></div>
      <div class="row2">
        <div><label>Pipe Size</label><select id="fps"><option>1/2"</option><option>3/4"</option><option>1"</option><option>1-1/4"</option><option>1-1/2"</option><option selected>2"</option><option>2-1/2"</option><option>3"</option><option>4"</option><option>6"</option><option>8"</option><option>10"</option><option>12"</option></select></div>
        <div><label>Run Length (LF)</label><input type="number" id="frl" value="100" min="10" max="5000"/></div>
      </div>
      <div class="row2">
        <div><label>Material</label><select id="fmt"><option>Type L Copper</option><option>Type K Copper</option><option>Sch 40 Steel</option><option selected>Schedule 80 Steel</option><option>304 Stainless Steel</option><option>316 Stainless Steel</option><option>CPVC</option><option>PEX-B</option><option>Black Steel Sch 40</option><option>Galvanized Steel Sch 40</option></select></div>
        <div><label>System Type</label><select id="fst" onchange="updateSys()"><option selected>Domestic Hot Water</option><option>Domestic Cold Water</option><option>Steam</option><option>Condensate Return</option><option>Chilled Water Supply</option><option>Chilled Water Return</option><option>Hydronic Heating</option><option>Process Piping</option><option>Gas (Med Pressure)</option><option>Fire Protection</option></select></div>
      </div>
      <div class="row2">
        <div><label>Building Type</label><select id="fbt"><option selected>Commercial Office</option><option>Hospital / Healthcare</option><option>Hotel</option><option>Industrial</option><option>High-Rise Residential</option><option>Lab / Research</option><option>Data Center</option><option>Mixed Use</option></select></div>
        <div><label>Joining Method</label><select id="fjm"><option selected>Threaded</option><option>Welded (Butt)</option><option>Welded (Socket)</option><option>Grooved /​​​​​​​​​​​​​​​​
<script>
const SYS={"Domestic Hot Water":{m:"#c0392b",a:"DHW",t:"#fff",d:"125 PSI @ 210°F",ret:true,ins:true},"Domestic Cold Water":{m:"#1a6fa8",a:"CW",t:"#fff",d:"125 PSI @ 60°F",ret:false,ins:false},"Steam":{m:"#b7950b",a:"STM",t:"#000",d:"15 PSI @ 250°F",ret:true,ins:true},"Condensate Return":{m:"#0e6655",a:"CR",t:"#fff",d:"30 PSI @ 212°F",ret:false,ins:true},"Chilled Water Supply":{m:"#154360",a:"CWS",t:"#fff",d:"125 PSI @ 45°F",ret:true,ins:true},"Chilled Water Return":{m:"#1a5276",a:"CWR",t:"#fff",d:"125 PSI @ 55°F",ret:false,ins:true},"Hydronic Heating":{m:"#943126",a:"HHW",t:"#fff",d:"125 PSI @ 180°F",ret:true,ins:true},"Process Piping":{m:"#6c3483",a:"PRO",t:"#fff",d:"VARIES",ret:false,ins:false},"Gas (Med Pressure)":{m:"#9a7d0a",a:"GAS",t:"#000",d:"5 PSI MAX",ret:false,ins:false},"Fire Protection":{m:"#c0392b",a:"FP",t:"#fff",d:"175 PSI",ret:false,ins:false}};
const CC={PIPE:"#c8860a",FITTINGS:"#3b82f6",VALVES:"#ef4444",INST:"#22c55e",SUPPORTS:"#a855f7",INSUL:"#f97316",MISC:"#64748b"};
const FM="'Courier New',monospace",FS="Arial,sans-serif";
const LW={THICK:3.5,MEDIUM:2.1,THIN:1.1,PHANTOM:1.1};
const gs=s=>SYS[s]||SYS["Domestic Hot Water"];
let JOB=null,TAB='plan';
function updateSys(){const sc=gs(document.getElementById('fst').value);const i=document.getElementById('sysi');i.style.background=sc.m+'14';i.style.border='1px solid '+sc.m+'44';document.getElementById('sdot').style.background=sc.m;document.getElementById('snm').style.color=sc.m;document.getElementById('snm').textContent=document.getElementById('fst').value;document.getElementById('sds').textContent=sc.d;}
updateSys();
function toggleSB(){const sb=document.getElementById('sb');sb.classList.toggle('closed');document.querySelector('#tabs .tb').textContent=sb.classList.contains('closed')?'▶':'◀';}
function setTab(btn,tab){TAB=tab;document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');if(JOB)renderTab();}
function getInp(){return{jobDesc:document.getElementById('fjd').value,pipeSize:document.getElementById('fps').value,material:document.getElementById('fmt').value,systemType:document.getElementById('fst').value,runLength:document.getElementById('frl').value,buildingType:document.getElementById('fbt').value,joiningMethod:document.getElementById('fjm').value,special:document.getElementById('fsp').value};}
function generate(){const btn=document.getElementById('gbtn');btn.disabled=true;btn.innerHTML='<div class="spin"></div> GENERATING…';setTimeout(()=>{JOB=buildJob(getInp());TAB='plan';document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('on',i===1));const s=document.getElementById('stats');s.style.display='flex';s.innerHTML=[{l:'DWG',v:JOB.dwgNo},{l:'TEST',v:JOB.testPSI+' PSI'},{l:'LABOR',v:JOB.laborHours+' HRS'},{l:'HANGERS',v:JOB.hs+"'-0\" O.C."}].map(x=>'<div class="chip"><span class="cl">'+x.l+'</span><span class="cv">'+x.v+'</span></div>').join('');renderTab();btn.disabled=false;btn.textContent='⊞ Generate Drawings';},80);}
function renderTab(){const cnt=document.getElementById('cnt');if(TAB==='plan'||TAB==='iso'){const iso=TAB==='iso';cnt.innerHTML='<div class="cwrap"><canvas id="cv" width="1500" height="'+(iso?1100:960)+'"></canvas></div>';document.getElementById('tact').innerHTML='<button class="ibtn" onclick="savePNG()">⬇ Save PNG</button>';if(iso)renderIso(document.getElementById('cv'),JOB,getInp());else renderPlan(document.getElementById('cv'),JOB,getInp());}else if(TAB==='det'){document.getElementById('tact').innerHTML='';renderDet();}else if(TAB==='mat'){document.getElementById('tact').innerHTML='';renderMat();}}
function savePNG(){const c=document.getElementById('cv');if(!c)return;const a=document.createElement('a');a.download=JOB.dwgNo+'_'+(TAB==='plan'?'Plan':'ISO')+'.png';a.href=c.toDataURL('image/png');a.click();}
function renderDet(){const j=JOB;document.getElementById('cnt').innerHTML='<div id="dpane">'+[{label:'Routing Strategy',key:'routing',icon:'→'},{label:'Code & Compliance',key:'compliance',icon:'⊠'},{label:'Labor Breakdown',key:'laborNotes',icon:'⏱'},{label:'Prefab / Spooling',key:'prefab',icon:'⊞'}].map(x=>'<div class="dsec"><div class="dhdr"><div class="dico">'+x.icon+'</div><div class="dlbl">'+x.label.toUpperCase()+'</div></div><div class="dtxt">'+j[x.key]+'</div></div>').join('')+'<div class="sgrid">'+[{label:'Labor Hours',value:j.laborHours,unit:'HRS',color:'#c8860a'},{label:'Hydrostatic Test',value:j.testPSI,unit:'PSI',color:'#3b82f6'},{label:'Hanger Spacing',value:j.hs+"'-0\"",unit:'O.C.',color:'#22c55e'},{label:'Drawing No.',value:j.dwgNo,unit:'',color:'#a855f7'}].map(c=>'<div class="scard"><div class="sclbl">'+c.label.toUpperCase()+'</div><span class="scval" style="color:'+c.color+'">'+c.value+'</span><span class="scunit">'+c.unit+'</span></div>').join('')+'</div></div>';}
function renderMat(){const m=JOB.mats.filter(x=>x.q>0);const cats={};m.forEach(x=>cats[x.c]=(cats[x.c]||0)+1);document.getElementById('cnt').innerHTML='<div id="mpane"><div class="cpills">'+Object.entries(cats).map(([c,n])=>'<div class="cpill" style="background:'+CC[c]+'18;border:1px solid '+CC[c]+'44;color:'+CC[c]+'"><div style="width:6px;height:6px;border-radius:50%;background:'+CC[c]+'"></div>'+c+' ('+n+')</div>').join('')+'</div><div class="mtbl"><table><thead><tr><th>#</th><th>Cat</th><th>Description</th><th style="text-align:right">Qty</th><th style="text-align:right">Unit</th></tr></thead><tbody>'+m.map((x,i)=>'<tr><td style="color:rgba(148,163,184,0.28);font-size:9px">'+String(i+1).padStart(2,'0')+'</td><td><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:5px;height:5px;border-radius:50%;background:'+CC[x.c]+'"></span><span style="font-size:9px;font-weight:700;color:'+CC[x.c]+'">'+x.c+'</span></span></td><td style="color:#cbd5e1;font-size:11px">'+x.i+'</td><td style="text-align:right;color:#f0a832;font-weight:700">'+x.q+'</td><td style="text-align:right;color:rgba(148,163,184,0.4);font-size:10px">'+x.u+'</td></tr>').join('')+'</tbody></table></div><div class="mnote">⚠ Quantities include 5% waste factor. Verify against stamped drawings before procurement.</div></div>';}
function buildJob(inp){const ft=Math.max(parseFloat(inp.runLength)||100,10),sz=parseFloat(inp.pipeSize)||2;const hs=sz>=6?17:sz>=4?14:sz>=2?10:sz>=1?8:6;const nv=Math.max(2,Math.round(ft/50));const isR=/floor|riser|vertical|rise|story/i.test(inp.jobDesc||"");const sc=gs(inp.systemType),nFl=isR?3:0;const testPSI=Math.round((parseFloat(sc.d)||125)*1.5);const bh=sz<=1?0.18:sz<=2?0.25:sz<=3?0.32:sz<=4?0.38:0.50;const jf=inp.joiningMethod.includes("Weld")?1.60:inp.joiningMethod==="Grooved / Victaulic"?1.20:1.00;const bf=inp.buildingType==="Hospital / Healthcare"?1.35:inp.buildingType==="Lab / Research"?1.25:1.00;const sf=/oshpd/i.test(inp.special||"")?1.40:1.00;const base=ft*bh*jf*bf*sf,minH=Math.round(base*0.85),maxH=Math.round(base*1.15);const pm=sc.ret?2.1:1.05,seg1=isR?ft*0.36:ft,seg2=isR?ft*0.22:0,seg3=isR?ft*0.42:0;const mats=[{c:"PIPE",i:inp.pipeSize+" "+inp.material+" Pipe",q:Math.round(ft*pm),u:"LF"},{c:"FITTINGS",i:inp.pipeSize+" 90° Elbow",q:Math.round(ft/18),u:"EA"},{c:"FITTINGS",i:inp.pipeSize+" 45° Elbow",q:Math.round(ft/45),u:"EA"},{c:"FITTINGS",i:inp.pipeSize+" Straight Tee",q:Math.round(ft/35),u:"EA"},{c:"FITTINGS",i:inp.pipeSize+" Reducing Tee",q:Math.max(1,Math.round(ft/60)),u:"EA"},{c:"FITTINGS",i:inp.pipeSize+" Reducer",q:Math.max(1,Math.round(ft/80)),u:"EA"},{c:"FITTINGS",i:inp.pipeSize+" Union",q:Math.max(2,nv*2),u:"EA"},{c:"VALVES",i:inp.pipeSize+" Gate Valve OS&Y",q:nv,u:"EA"},{c:"VALVES",i:inp.pipeSize+" Globe Valve",q:Math.max(1,Math.round(nv*0.5)),u:"EA"},{c:"VALVES",i:inp.pipeSize+" Check Valve",q:Math.max(1,Math.round(nv*0.6)),u:"EA"},{c:"VALVES",i:inp.pipeSize+" Ball Valve",q:Math.max(1,Math.round(nv*0.7)),u:"EA"},{c:"VALVES",i:inp.pipeSize+' Y-Strainer',q:Math.max(1,Math.round(ft/120)),u:"EA"},{c:"INST",i:'Pressure Gauge 0-160 PSI',q:Math.max(2,Math.round(ft/80)),u:"EA"},{c:"INST",i:'Thermometer w/ Thermowell',q:Math.max(2,Math.round(ft/80)),u:"EA"},{c:"INST",i:'Auto Air Vent 1/2" FPT',q:isR?nFl:1,u:"EA"},{c:"INST",i:'Drain Valve 3/4" Gate
